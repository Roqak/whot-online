<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15172c" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Last Card: play Whot online with friends</title>
    <meta
      name="description"
      content="Play Whot, the Nigerian card game, online with friends or bots. No signup: create a table, share the link, deal."
    />
    <link rel="canonical" href="https://lastcard.fun/" />
    <meta property="og:site_name" content="Last Card" />
    <meta property="og:title" content="Last Card: play Whot with your people" />
    <meta property="og:description" content="Create a table, share the link, deal. Friends can even watch in 3D." />
    <meta property="og:url" content="https://lastcard.fun/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fonts never block the first paint: on slow mobile data a render-blocking
      Google Fonts request kept even the boot screen from showing. The page
      draws in system fonts and swaps when these arrive. Lab fonts load with the labs.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- Boot screen styles are inline: they must work even if the app's own CSS fails to load. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0e1022;
        color: #efe9dc;
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        /* Held back briefly so a fast load never flashes it. */
        animation: boot-in 0.2s 0.5s both;
      }
      #boot[hidden],
      #boot [hidden] {
        display: none !important;
      }
      .boot-card {
        max-width: 22rem;
      }
      .boot-mark {
        width: 44px;
        height: 60px;
        margin: 0 auto 18px;
        border-radius: 8px;
        background: #f5eee1;
        box-shadow: 12px -4px 0 -2px rgba(245, 238, 225, 0.22);
        animation: boot-deal 1.4s ease-in-out infinite;
      }
      .boot-title {
        margin: 0;
        font-weight: 600;
      }
      .boot-hint {
        margin: 8px 0 0;
        color: #b9b3c9;
        font-size: 14px;
      }
      .boot-error {
        margin: 12px 0 0;
        color: #e8907c;
        font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace;
        overflow-wrap: anywhere;
      }
      .boot-reload {
        margin-top: 18px;
        padding: 10px 20px;
        border: 0;
        border-radius: 10px;
        background: #f2c14e;
        color: #15172c;
        font: 600 14px system-ui, sans-serif;
        cursor: pointer;
      }
      .boot-fresh {
        display: block;
        margin: 12px auto 0;
        padding: 8px 12px;
        border: 0;
        background: none;
        color: #b9b3c9;
        font: 500 13px system-ui, sans-serif;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes boot-deal {
        0%,
        100% {
          transform: rotate(-6deg);
        }
        50% {
          transform: rotate(6deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark {
          animation: none;
        }
      }
      /* The error log survives React: when the game crashes, this is what
         the player (and we, from their screenshot) can actually read. */
      #jslog {
        position: fixed;
        inset: auto 0 0 0;
        z-index: 2147483647;
        display: none;
        max-height: 42vh;
        overflow-y: auto;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
        background: rgba(11, 14, 20, 0.96);
        color: #e8907c;
        font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border-top: 1px solid #3a4356;
      }
      #jslog:not(:empty) {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-card">
        <div class="boot-mark" aria-hidden="true"></div>
        <p class="boot-title">Dealing the cards…</p>
        <p class="boot-hint" hidden>
          This is taking longer than it should. Refresh the page, or try again with browser extensions turned off.
        </p>
        <p class="boot-error" hidden></p>
        <button class="boot-reload" type="button" hidden>Refresh</button>
        <button class="boot-fresh" type="button" hidden>Start fresh</button>
      </div>
    </div>
    <div id="root"></div>
    <div id="jslog" aria-live="polite" onclick="this.textContent=''"></div>
    <noscript>
      <p style="position: fixed; inset: auto 0 40%; text-align: center; color: #efe9dc; font: 15px system-ui, sans-serif">
        Last Card needs JavaScript turned on to deal the cards.
      </p>
    </noscript>
    <!--
      Until the game draws itself, this keeps the page from ever sitting blank.
      It lives outside #root and watches it, so it also covers a crash after the
      game has mounted. Plain ES5, no dependencies: it must run where the app cannot.
    -->
    <script>
      ;(function () {
        // Every error that reaches the window lands in #jslog, which sits
        // above everything and survives a React crash. Tap it to clear.
        // Players never see it: it's on at localhost, or on a phone after
        // opening the site with ?debug=1 (remembered until ?debug=0), so a
        // player can show us the error in a screenshot when we ask.
        var log = document.getElementById('jslog')
        var debug = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
        try {
          var flag = /[?&]debug=([01])/.exec(location.search)
          if (flag) localStorage.setItem('whot:debug', flag[1])
          if (localStorage.getItem('whot:debug') === '1') debug = true
          if (localStorage.getItem('whot:debug') === '0') debug = false
        } catch (e) {}
        if (log && !debug) log.dataset.off = '1'
        function note() {
          if (!log || log.dataset.off) return
          log.textContent += Array.prototype.slice.call(arguments).join(' ') + '\n'
          log.scrollTop = log.scrollHeight
        }
        window.__note = note
        var err = console.error
        console.error = function () {
          note.apply(null, arguments)
          try {
            err.apply(console, arguments)
          } catch (e) {}
        }
        window.addEventListener('error', function (event) {
          note('Error:', event.message, 'at', (event.filename || '') + ':' + (event.lineno || 0))
        })
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason
          note('Rejected:', reason && reason.message ? reason.message : String(reason))
        })

        var boot = document.getElementById('boot')
        var root = document.getElementById('root')
        var title = boot.querySelector('.boot-title')
        var hint = boot.querySelector('.boot-hint')
        var detail = boot.querySelector('.boot-error')
        var reload = boot.querySelector('.boot-reload')
        var fresh = boot.querySelector('.boot-fresh')
        var failed = false
        var crashed = false
        var retrying = false
        var everMounted = false

        // "Start fresh" busts caches with ?fresh=; don't leave it in links people share.
        if (/[?&]fresh=/.test(location.search) && history.replaceState) {
          history.replaceState(history.state, '', location.pathname + location.hash)
        }

        // Retries survive the reload they trigger, but not the tab: a dropped
        // file on mobile data is usually fixed by simply asking again.
        var RETRY_KEY = 'whot:bootRetries'
        var MAX_RETRIES = 3
        function retries() {
          try {
            return Number(sessionStorage.getItem(RETRY_KEY)) || 0
          } catch (e) {
            return MAX_RETRIES
          }
        }
        function setRetries(n) {
          try {
            if (n) sessionStorage.setItem(RETRY_KEY, String(n))
            else sessionStorage.removeItem(RETRY_KEY)
          } catch (e) {}
        }

        function slowNetwork() {
          var c = navigator.connection
          return !!(c && (c.saveData || /(^|-)2g|3g/.test(c.effectiveType || '')))
        }

        reload.onclick = function () {
          setRetries(0)
          location.reload()
        }

        // Everything a stale or broken load could be hiding behind, short of
        // the player's own data (name, settings, stats stay in localStorage).
        fresh.onclick = function () {
          setRetries(0)
          var jobs = []
          try {
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              jobs.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister() }))
                }),
              )
            }
            if (window.caches && caches.keys) {
              jobs.push(
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k) }))
                }),
              )
            }
          } catch (e) {}
          var go = function () {
            location.replace(location.pathname + '?fresh=' + Date.now() + location.hash)
          }
          Promise.all(jobs).then(go, go)
          setTimeout(go, 1500)
        }

        function mounted() {
          return root.childElementCount > 0
        }

        function show(titleText, hintText, buttons) {
          boot.hidden = false
          title.textContent = titleText
          hint.textContent = hintText
          hint.hidden = !hintText
          reload.hidden = !buttons
          fresh.hidden = buttons !== 'both'
        }

        function trouble(message) {
          if (mounted() || retrying) return
          if (crashed) show('Something went wrong', 'Refresh to get back to the table.', 'both')
          else if (failed) show('The game could not load', 'Check your connection, then refresh. If it keeps happening, start fresh.', 'both')
          else
            show(
              'Still dealing…',
              slowNetwork()
                ? 'Your connection is slow, so this can take a moment. Hang on.'
                : 'This is taking longer than usual. Hang on, or refresh.',
              'refresh',
            )
          if (message) {
            detail.textContent = String(message).slice(0, 300)
            detail.hidden = false
          }
        }

        // A file failed to arrive: try again by itself a few times, backing off,
        // before asking the player to do anything.
        function retryOrFail(message) {
          if (retrying) return
          var n = retries()
          if (n < MAX_RETRIES) {
            retrying = true
            setRetries(n + 1)
            show('Reconnecting…', n ? 'Still trying (' + (n + 1) + ' of ' + MAX_RETRIES + ')' : 'The connection dropped a file. Trying again.', null)
            setTimeout(function () {
              location.reload()
            }, 1000 * Math.pow(2, n))
            return
          }
          failed = true
          trouble(message)
        }
        window.__bootRetry = retryOrFail

        function chunkError(message) {
          return /dynamically imported module|Importing a module script failed|Unable to preload CSS/i.test(String(message))
        }

        new MutationObserver(function () {
          if (mounted()) {
            everMounted = true
            boot.hidden = true
            // Stayed up: the next failure gets a full set of retries again. Not
            // straight away, or a screen whose code is gone for good would
            // mount, fail, reload and mount again forever.
            setTimeout(function () {
              if (mounted()) setRetries(0)
            }, 10000)
          } else if (everMounted) {
            // The game was up and then emptied itself: it crashed.
            failed = true
            crashed = true
            trouble(detail.textContent)
          }
        }).observe(root, { childList: true })

        // Only the game's own files are fatal. A blocked font or tracker is not.
        function ours(url) {
          return typeof url === 'string' && url.indexOf(location.origin) === 0
        }

        window.addEventListener(
          'error',
          function (event) {
            var target = event.target
            if (target && target !== window && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
              var url = target.src || target.href
              if (!ours(url)) return
              retryOrFail('Could not load ' + url)
            } else if (event.message) {
              if (chunkError(event.message) && !mounted()) return retryOrFail(event.message)
              failed = true
              detail.textContent = String(event.message).slice(0, 300)
              trouble(event.message)
            }
          },
          true,
        )

        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason
          var message = reason && reason.message ? reason.message : String(reason)
          if (mounted()) return
          if (chunkError(message)) return retryOrFail(message)
          failed = true
          trouble(message)
        })

        // A tab left open across a deploy asks for chunks that no longer exist.
        // Vite reports it here; a reload picks up the new build.
        window.addEventListener('vite:preloadError', function (event) {
          event.preventDefault()
          retryOrFail(event.payload && event.payload.message)
        })

        // Slow is not broken: say so calmly first, offer a clean slate later.
        setTimeout(function () {
          trouble()
        }, 12000)
        setTimeout(function () {
          if (mounted() || retrying) return
          show('Still dealing…', 'Still no luck. Refresh, or start fresh to clear anything stale.', 'both')
        }, 40000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
